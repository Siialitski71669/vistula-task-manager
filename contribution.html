<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contribution</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Team Contribution</h1>
    <p>Contributor information for the Task Manager project.</p>

    <button id="load-contributor">Show Contributor</button>
    <p id="contributor-student-id"></p>

    <a href="index.html">Back to Task Manager</a>

    <script>
        document.getElementById("load-contributor").addEventListener("click", async () => {
            const output = document.getElementById("contributor-student-id");

            try {
                const response = await fetch("./contribution.json");

                if (!response.ok) {
                    throw new Error("Could not load contributor information");
                }

                const data = await response.json();
                output.textContent = "Contributor Student ID: " + data.contributorStudentId;
            } catch (error) {
                output.textContent = error.message;
            }
        });
    </script>
</body>
</html>
